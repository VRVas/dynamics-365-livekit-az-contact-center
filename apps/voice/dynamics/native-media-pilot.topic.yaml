kind: AdaptiveDialog
beginDialog:
  kind: OnRedirect
  id: main
  actions:
    - kind: SetVariable
      id: native_capture_context
      variable: Topic.NativeConversationId
      value: =Lower(Global.msdyn_ConversationId)

    - kind: ConditionGroup
      id: native_require_context
      conditions:
        - id: native_missing_context
          condition: =IsBlank(Topic.NativeConversationId)
          actions:
            - kind: SendActivity
              id: native_missing_context_error
              activity:
                text:
                  - Sorry, the voice connection could not start. Please end this call and try again.
                speak:
                  - Sorry, the voice connection could not start. Please end this call and try again.
            - kind: EndDialog
              id: native_missing_context_end

    - kind: SetVariable
      id: native_reset_start_result
      variable: Topic.NativeResult
      value: '={action: Text(""), azure_leg_detached: false, conversation_id: Text(""), phase: Text(""), reason: Text(""), utterance_sequence: 0, utterance_id: Text(""), utterance_text: Text(""), utterance_timestamp: Text("")}'

    - kind: SetVariable
      id: native_reset_stop_result
      variable: Topic.NativeStopResult
      value: '={action: Text(""), azure_leg_detached: false, conversation_id: Text(""), phase: Text(""), reason: Text(""), utterance_sequence: 0, utterance_id: Text(""), utterance_text: Text(""), utterance_timestamp: Text("")}'

    - kind: SetVariable
      id: native_reset_transcript_cursor
      variable: Topic.NativeTranscriptCursor
      value: 0

    - kind: SendActivity
      id: native_connecting_notice
      activity:
        text:
          - One moment while I connect the voice assistant.
        speak:
          - One moment while I connect the voice assistant.

    - kind: SetVariable
      id: native_silence_controller
      variable: System.Conversation.OnlyAllowDTMF
      value: true

    - kind: SetVariable
      id: native_reset_poll_count
      variable: Topic.NativePollCount
      value: 0

    - kind: HttpRequestAction
      id: native_start
      method: Post
      url: __VOICE_ORIGIN__/dynamics/native/sessions
      headers:
        X-API-Key: __NATIVE_MEDIA_API_KEY__
      body:
        kind: RawRequestContent
        contentType: application/json
        content: '=JSON({conversation_id: Topic.NativeConversationId, language: "ar", retain_native_controller: true})'
      errorHandling:
        kind: ContinueOnErrorBehavior
        statusCode: Topic.NativeHttpStatus
        errorResponseBody: Topic.NativeHttpError
      response: Topic.NativeResult
      responseSchema:
        kind: Record
        properties:
          action: String
          azure_leg_detached: Boolean
          conversation_id: String
          phase: String
          reason: String
          utterance_sequence: Number
          utterance_id: String
          utterance_text: String
          utterance_timestamp: String

    - kind: ConditionGroup
      id: native_check_start
      conditions:
        - id: native_start_failed
          condition: =Lower(Topic.NativeResult.conversation_id) <> Topic.NativeConversationId
          actions:
            - kind: GotoAction
              id: native_start_to_cleanup
              actionId: native_cleanup

    - kind: SetVariable
      id: native_reset_wait_result
      variable: Topic.NativeResult
      value: '={action: Text(""), azure_leg_detached: false, conversation_id: Text(""), phase: Text(""), reason: Text(""), utterance_sequence: 0, utterance_id: Text(""), utterance_text: Text(""), utterance_timestamp: Text("")}'

    - kind: HttpRequestAction
      id: native_wait
      method: Get
      url: '=Concatenate("__VOICE_ORIGIN__/dynamics/native/sessions/", Topic.NativeConversationId, "?wait=true&transcript_after=", Text(Topic.NativeTranscriptCursor, "0"))'
      headers:
        X-API-Key: __NATIVE_MEDIA_API_KEY__
      errorHandling:
        kind: ContinueOnErrorBehavior
        statusCode: Topic.NativeHttpStatus
        errorResponseBody: Topic.NativeHttpError
      response: Topic.NativeResult
      responseSchema:
        kind: Record
        properties:
          action: String
          azure_leg_detached: Boolean
          conversation_id: String
          phase: String
          reason: String
          utterance_sequence: Number
          utterance_id: String
          utterance_text: String
          utterance_timestamp: String

    - kind: SetVariable
      id: native_count_poll
      variable: Topic.NativePollCount
      value: =If(IsBlank(Topic.NativeResult.utterance_text), Topic.NativePollCount + 1, Topic.NativePollCount)

    - kind: ConditionGroup
      id: native_dispatch_result
      conditions:
        - id: native_result_invalid
          condition: =Lower(Topic.NativeResult.conversation_id) <> Topic.NativeConversationId || (!IsBlank(Topic.NativeResult.utterance_text) && (Topic.NativeResult.utterance_sequence <> Topic.NativeTranscriptCursor + 1 || IsBlank(Topic.NativeResult.utterance_id)))
          actions:
            - kind: GotoAction
              id: native_invalid_to_cleanup
              actionId: native_cleanup
        - id: native_transcript_received
          condition: =!IsBlank(Topic.NativeResult.utterance_text) && (Topic.NativeResult.action = "wait" || Topic.NativeResult.action = "handover")
          actions:
            - kind: SetVariable
              id: native_transcript_message_mode
              variable: System.Conversation.OnlyAllowDTMF
              value: false
            - kind: SendActivity
              id: native_publish_humain_text
              activity:
                text:
                  - "{Topic.NativeResult.utterance_text}"
                speak:
                  - <break time="20ms" />
            - kind: SetVariable
              id: native_transcript_restore_control
              variable: System.Conversation.OnlyAllowDTMF
              value: true
            - kind: SetVariable
              id: native_acknowledge_transcript
              variable: Topic.NativeTranscriptCursor
              value: =Topic.NativeResult.utterance_sequence
            - kind: SetVariable
              id: native_reset_transcript_result
              variable: Topic.NativeResult
              value: '={action: Text(""), azure_leg_detached: false, conversation_id: Text(""), phase: Text(""), reason: Text(""), utterance_sequence: 0, utterance_id: Text(""), utterance_text: Text(""), utterance_timestamp: Text("")}'
            - kind: GotoAction
              id: native_wait_after_transcript
              actionId: native_wait
        - id: native_handover_ready
          condition: =Topic.NativeResult.action = "handover" && Topic.NativeResult.phase = "handover_ready" && Topic.NativeResult.azure_leg_detached
          actions:
            - kind: GotoAction
              id: native_result_to_handover
              actionId: native_restore_speech
        - id: native_keep_waiting
          condition: =Topic.NativeResult.action = "wait" && Topic.NativePollCount < 10
          actions:
            - kind: SetVariable
              id: native_reset_loop_result
              variable: Topic.NativeResult
              value: '={action: Text(""), azure_leg_detached: false, conversation_id: Text(""), phase: Text(""), reason: Text(""), utterance_sequence: 0, utterance_id: Text(""), utterance_text: Text(""), utterance_timestamp: Text("")}'
            - kind: GotoAction
              id: native_poll_again
              actionId: native_wait
      elseActions:
        - kind: GotoAction
          id: native_stop_to_cleanup
          actionId: native_cleanup

    - kind: SetVariable
      id: native_restore_speech
      variable: System.Conversation.OnlyAllowDTMF
      value: false

    - kind: TransferConversationV2
      id: native_transfer_to_agent
      transferType:
        kind: TransferToAgent
        messageToAgent:
          text:
            - The voice assistant requested native handover. Continue this Dynamics conversation and review its native transcript.

    - kind: EndDialog
      id: native_handover_complete

    - kind: HttpRequestAction
      id: native_cleanup
      method: Post
      url: '=Concatenate("__VOICE_ORIGIN__/dynamics/native/sessions/", Topic.NativeConversationId, "/stop")'
      headers:
        X-API-Key: __NATIVE_MEDIA_API_KEY__
      errorHandling:
        kind: ContinueOnErrorBehavior
        statusCode: Topic.NativeStopStatus
        errorResponseBody: Topic.NativeStopError
      response: Topic.NativeStopResult
      responseSchema:
        kind: Record
        properties:
          action: String
          azure_leg_detached: Boolean
          conversation_id: String
          phase: String
          reason: String
          utterance_sequence: Number
          utterance_id: String
          utterance_text: String
          utterance_timestamp: String

    - kind: ConditionGroup
      id: native_check_cleanup
      conditions:
        - id: native_completed_handover_recovered
          condition: =Lower(Topic.NativeStopResult.conversation_id) = Topic.NativeConversationId && Topic.NativeStopResult.action = "handover" && Topic.NativeStopResult.phase = "handover_ready" && Topic.NativeStopResult.azure_leg_detached
          actions:
            - kind: GotoAction
              id: native_cleanup_to_handover
              actionId: native_restore_speech
        - id: native_controller_already_moved
          condition: =Lower(Topic.NativeStopResult.conversation_id) = Topic.NativeConversationId && (Topic.NativeStopResult.reason = "human_already_assigned" || Topic.NativeStopResult.reason = "controller_changed" || Topic.NativeStopResult.reason = "native_call_not_active")
          actions:
            - kind: SetVariable
              id: native_restore_after_move
              variable: System.Conversation.OnlyAllowDTMF
              value: false
            - kind: EndDialog
              id: native_return_after_move

    - kind: SetVariable
      id: native_report_failure
      variable: System.Conversation.OnlyAllowDTMF
      value: false

    - kind: SendActivity
      id: native_connection_error
      activity:
        text:
          - Sorry, the voice connection could not continue. Please end this call and try again.
        speak:
          - Sorry, the voice connection could not continue. Please end this call and try again.

    - kind: EndDialog
      id: native_end_failed_topic

inputType: {}
outputType: {}
