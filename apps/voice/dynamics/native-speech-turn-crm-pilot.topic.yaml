# Generated by infra/scripts/sync_native_voice_topic.py; do not edit directly.
kind: AdaptiveDialog
beginDialog:
  kind: OnRedirect
  id: main
  actions:
    - kind: SetVariable
      id: native_capture_context
      variable: Topic.NativeConversationId
      value: =Lower(Global.msdyn_ConversationId)
    - kind: SetVariable
      id: native_initialize_case_number
      variable: init:Global.CaseNumber
      value: =Text("")
    - kind: SetVariable
      id: native_initialize_handover_case
      variable: init:Topic.NativeHandoverCaseNumber
      value: =Text("")
    - kind: ConditionGroup
      id: native_require_context
      conditions:
        - id: native_missing_context
          condition: =IsBlank(Topic.NativeConversationId)
          actions:
            - kind: SendActivity
              id: native_missing_context_error
              activity:
                text:
                  - Sorry, the voice connection could not start. Please end this call and try again.
                speak:
                  - Sorry, the voice connection could not start. Please end this call and try again.
            - kind: EndDialog
              id: native_missing_context_end
    - kind: SetVariable
      id: native_reset_start_result
      variable: Topic.NativeResult
      value: '={action: Text(""), azure_leg_detached: false, conversation_id: Text(""), phase: Text(""), reason: Text(""), utterance_sequence: 0, utterance_id: Text(""), utterance_text: Text(""), utterance_timestamp: Text(""), control_language: Text(""), control_revision: 0, control_ready: false, selected_case_id: Text(""), selected_case_number: Text(""), case_link_status: Text(""), case_link_error: Text(""), case_link_http_status: 0, case_link_stage: Text(""), case_link_verified_at: Text(""), case_link_already_linked: false}'
    - kind: SetVariable
      id: native_reset_stop_result
      variable: Topic.NativeStopResult
      value: '={action: Text(""), azure_leg_detached: false, conversation_id: Text(""), phase: Text(""), reason: Text(""), utterance_sequence: 0, utterance_id: Text(""), utterance_text: Text(""), utterance_timestamp: Text(""), control_language: Text(""), control_revision: 0, control_ready: false, selected_case_id: Text(""), selected_case_number: Text(""), case_link_status: Text(""), case_link_error: Text(""), case_link_http_status: 0, case_link_stage: Text(""), case_link_verified_at: Text(""), case_link_already_linked: false}'
    - kind: SetVariable
      id: native_initialize_listening_language
      variable: Topic.NativeListenLanguage
      value: ar
    - kind: SetVariable
      id: native_initialize_language_revision
      variable: Topic.NativeLanguageRevision
      value: 0
    - kind: SendActivity
      id: native_connecting_notice
      activity:
        text:
          - One moment while I connect the voice assistant.
        speak:
          - One moment while I connect the voice assistant.
    - kind: SetVariable
      id: native_silence_controller
      variable: System.Conversation.OnlyAllowDTMF
      value: false
    - kind: SetVariable
      id: native_reset_poll_count
      variable: Topic.NativePollCount
      value: 0
    - kind: HttpRequestAction
      id: native_start
      method: Post
      url: __VOICE_ORIGIN__/dynamics/native/sessions
      headers:
        X-API-Key: __NATIVE_MEDIA_API_KEY__
      body:
        kind: RawRequestContent
        contentType: application/json
        content: '=JSON({conversation_id: Topic.NativeConversationId, language: "ar", retain_native_controller: true, speech_turn_control: true})'
      errorHandling:
        kind: ContinueOnErrorBehavior
        statusCode: Topic.NativeHttpStatus
        errorResponseBody: Topic.NativeHttpError
      response: Topic.NativeResult
      responseSchema:
        kind: Record
        properties:
          action: String
          azure_leg_detached: Boolean
          conversation_id: String
          phase: String
          reason: String
          utterance_sequence: Number
          utterance_id: String
          utterance_text: String
          utterance_timestamp: String
          control_language: String
          control_revision: Number
          control_ready: Boolean
          selected_case_id: String
          selected_case_number: String
          case_link_status: String
          case_link_error: String
          case_link_http_status: Number
          case_link_stage: String
          case_link_verified_at: String
          case_link_already_linked: Boolean
    - kind: ConditionGroup
      id: native_check_start
      conditions:
        - id: native_start_failed
          condition: =Lower(Topic.NativeResult.conversation_id) <> Topic.NativeConversationId
          actions:
            - kind: GotoAction
              id: native_start_to_cleanup
              actionId: native_cleanup
    - kind: SetVariable
      id: native_reset_wait_result
      variable: Topic.NativeResult
      value: '={action: Text(""), azure_leg_detached: false, conversation_id: Text(""), phase: Text(""), reason: Text(""), utterance_sequence: 0, utterance_id: Text(""), utterance_text: Text(""), utterance_timestamp: Text(""), control_language: Text(""), control_revision: 0, control_ready: false, selected_case_id: Text(""), selected_case_number: Text(""), case_link_status: Text(""), case_link_error: Text(""), case_link_http_status: 0, case_link_stage: Text(""), case_link_verified_at: Text(""), case_link_already_linked: false}'
    - kind: ConditionGroup
      id: native_select_listening_language
      conditions:
        - id: native_language_is_ar
          condition: =Topic.NativeListenLanguage = "ar"
          actions:
            - kind: SetVariable
              id: native_listen_in_ar
              variable: System.User.Language
              value:
                kind: OptionDataValue
                type:
                  kind: SystemOptionSet
                  name: Locale
                value: Arabic
        - id: native_language_is_en
          condition: =Topic.NativeListenLanguage = "en"
          actions:
            - kind: SetVariable
              id: native_listen_in_en
              variable: System.User.Language
              value:
                kind: OptionDataValue
                type:
                  kind: SystemOptionSet
                  name: Locale
                value: English
      elseActions:
        - kind: GotoAction
          id: native_invalid_language_cleanup
          actionId: native_cleanup
    - kind: Question
      id: native_listen_turn
      interruptionPolicy:
        allowInterruption: false
      alwaysPrompt: true
      variable: init:Topic.NativeObservedSpeech
      prompt:
        speak:
          - <break time="20ms" />
      entity: StringPrebuiltEntity
      voiceInputSettings:
        silenceDetectionTimeoutInMilliseconds: 500
        repeatCountOnSilence: 0
        defaultValueMissingAction: SetEmpty
        defaultValueOnSilence: =Blank()
        utteranceEndTimeoutInMilliseconds: 300
        speechRecognitionTimeoutInMilliseconds: 1000
    - kind: HttpRequestAction
      id: native_wait
      method: Post
      url: =Concatenate("__VOICE_ORIGIN__/dynamics/native/sessions/", Topic.NativeConversationId, "/turn")
      headers:
        X-API-Key: __NATIVE_MEDIA_API_KEY__
      errorHandling:
        kind: ContinueOnErrorBehavior
        statusCode: Topic.NativeHttpStatus
        errorResponseBody: Topic.NativeHttpError
      response: Topic.NativeResult
      responseSchema:
        kind: Record
        properties:
          action: String
          azure_leg_detached: Boolean
          conversation_id: String
          phase: String
          reason: String
          utterance_sequence: Number
          utterance_id: String
          utterance_text: String
          utterance_timestamp: String
          control_language: String
          control_revision: Number
          control_ready: Boolean
          selected_case_id: String
          selected_case_number: String
          case_link_status: String
          case_link_error: String
          case_link_http_status: Number
          case_link_stage: String
          case_link_verified_at: String
          case_link_already_linked: Boolean
      body:
        kind: RawRequestContent
        contentType: application/json
        content: '=JSON({language: Topic.NativeListenLanguage, revision: Topic.NativeLanguageRevision})'
    - kind: SetVariable
      id: native_count_poll
      variable: Topic.NativePollCount
      value: =Topic.NativePollCount + 1
    - kind: ConditionGroup
      id: native_dispatch_result
      conditions:
        - id: native_result_invalid
          condition: =Lower(Topic.NativeResult.conversation_id) <> Topic.NativeConversationId || (Topic.NativeResult.action = "wait" && ((Topic.NativeResult.control_language <> "ar" && Topic.NativeResult.control_language <> "en") || Topic.NativeResult.control_revision < Topic.NativeLanguageRevision))
          actions:
            - kind: GotoAction
              id: native_invalid_to_cleanup
              actionId: native_cleanup
        - id: native_handover_ready
          condition: =Topic.NativeResult.action = "handover" && Topic.NativeResult.phase = "handover_ready" && Topic.NativeResult.azure_leg_detached
          actions:
            - kind: SetVariable
              id: native_case_from_status
              variable: Topic.NativeHandoverCaseNumber
              value: =If(IsMatch(Topic.NativeResult.selected_case_id, "[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}") && Topic.NativeResult.selected_case_id <> "00000000-0000-0000-0000-000000000000" && IsMatch(Topic.NativeResult.selected_case_number, "[A-Za-z0-9][A-Za-z0-9\-]{2,79}") && !StartsWith(Upper(Topic.NativeResult.selected_case_number), "OP-") && !IsMatch(Topic.NativeResult.selected_case_number, "[0-9A-Fa-f]{32}|[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}"), Topic.NativeResult.selected_case_number, Text(""))
            - kind: GotoAction
              id: native_result_to_handover
              actionId: native_restore_speech
        - id: native_keep_waiting
          condition: =Topic.NativeResult.action = "wait" && Topic.NativePollCount < 3000
          actions:
            - kind: SetVariable
              id: native_capture_requested_language
              variable: Topic.NativeListenLanguage
              value: =Topic.NativeResult.control_language
            - kind: SetVariable
              id: native_capture_requested_revision
              variable: Topic.NativeLanguageRevision
              value: =Topic.NativeResult.control_revision
            - kind: SetVariable
              id: native_reset_loop_result
              variable: Topic.NativeResult
              value: '={action: Text(""), azure_leg_detached: false, conversation_id: Text(""), phase: Text(""), reason: Text(""), utterance_sequence: 0, utterance_id: Text(""), utterance_text: Text(""), utterance_timestamp: Text(""), control_language: Text(""), control_revision: 0, control_ready: false, selected_case_id: Text(""), selected_case_number: Text(""), case_link_status: Text(""), case_link_error: Text(""), case_link_http_status: 0, case_link_stage: Text(""), case_link_verified_at: Text(""), case_link_already_linked: false}'
            - kind: GotoAction
              id: native_poll_again
              actionId: native_select_listening_language
      elseActions:
        - kind: GotoAction
          id: native_stop_to_cleanup
          actionId: native_cleanup
    - kind: SetVariable
      id: native_restore_speech
      variable: System.Conversation.OnlyAllowDTMF
      value: false
    - kind: SetVariable
      id: native_set_case_number
      variable: Global.CaseNumber
      value: =Topic.NativeHandoverCaseNumber
    - kind: TransferConversationV2
      id: native_transfer_to_agent
      transferType:
        kind: TransferToAgent
        messageToAgent:
          text:
            - The voice assistant requested native handover. Continue this Dynamics conversation and review its native transcript.
    - kind: EndDialog
      id: native_handover_complete
    - kind: HttpRequestAction
      id: native_cleanup
      method: Post
      url: =Concatenate("__VOICE_ORIGIN__/dynamics/native/sessions/", Topic.NativeConversationId, "/stop")
      headers:
        X-API-Key: __NATIVE_MEDIA_API_KEY__
      errorHandling:
        kind: ContinueOnErrorBehavior
        statusCode: Topic.NativeStopStatus
        errorResponseBody: Topic.NativeStopError
      response: Topic.NativeStopResult
      responseSchema:
        kind: Record
        properties:
          action: String
          azure_leg_detached: Boolean
          conversation_id: String
          phase: String
          reason: String
          utterance_sequence: Number
          utterance_id: String
          utterance_text: String
          utterance_timestamp: String
          control_language: String
          control_revision: Number
          control_ready: Boolean
          selected_case_id: String
          selected_case_number: String
          case_link_status: String
          case_link_error: String
          case_link_http_status: Number
          case_link_stage: String
          case_link_verified_at: String
          case_link_already_linked: Boolean
    - kind: ConditionGroup
      id: native_check_cleanup
      conditions:
        - id: native_completed_handover_recovered
          condition: =Lower(Topic.NativeStopResult.conversation_id) = Topic.NativeConversationId && Topic.NativeStopResult.action = "handover" && Topic.NativeStopResult.phase = "handover_ready" && Topic.NativeStopResult.azure_leg_detached
          actions:
            - kind: SetVariable
              id: native_case_from_stop
              variable: Topic.NativeHandoverCaseNumber
              value: =If(IsMatch(Topic.NativeStopResult.selected_case_id, "[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}") && Topic.NativeStopResult.selected_case_id <> "00000000-0000-0000-0000-000000000000" && IsMatch(Topic.NativeStopResult.selected_case_number, "[A-Za-z0-9][A-Za-z0-9\-]{2,79}") && !StartsWith(Upper(Topic.NativeStopResult.selected_case_number), "OP-") && !IsMatch(Topic.NativeStopResult.selected_case_number, "[0-9A-Fa-f]{32}|[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}"), Topic.NativeStopResult.selected_case_number, Text(""))
            - kind: GotoAction
              id: native_cleanup_to_handover
              actionId: native_restore_speech
        - id: native_controller_already_moved
          condition: =Lower(Topic.NativeStopResult.conversation_id) = Topic.NativeConversationId && (Topic.NativeStopResult.reason = "human_already_assigned" || Topic.NativeStopResult.reason = "controller_changed" || Topic.NativeStopResult.reason = "native_call_not_active")
          actions:
            - kind: SetVariable
              id: native_restore_after_move
              variable: System.Conversation.OnlyAllowDTMF
              value: false
            - kind: EndDialog
              id: native_return_after_move
    - kind: SetVariable
      id: native_report_failure
      variable: System.Conversation.OnlyAllowDTMF
      value: false
    - kind: SendActivity
      id: native_connection_error
      activity:
        text:
          - Sorry, the voice connection could not continue. Please end this call and try again.
        speak:
          - Sorry, the voice connection could not continue. Please end this call and try again.
    - kind: EndDialog
      id: native_end_failed_topic
inputType: {}
outputType: {}
