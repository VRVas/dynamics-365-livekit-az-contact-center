kind: AdaptiveDialog
beginDialog:
  kind: OnRedirect
  id: main
  actions:
    - kind: SetVariable
      id: language_probe_arabic
      variable: System.User.Language
      value:
        kind: OptionDataValue
        type:
          kind: SystemOptionSet
          name: Locale
        value: Arabic

    - kind: Question
      id: language_probe_arabic_message
      interruptionPolicy:
        allowInterruption: false
      alwaysPrompt: true
      variable: init:Topic.ArabicConfirmed
      voiceInputSettings:
        silenceDetectionTimeoutInMilliseconds: 500
        repeatCountOnSilence: 0
        defaultValueMissingAction: SetEmpty
        defaultValueOnSilence: =Blank()
        utteranceEndTimeoutInMilliseconds: 300
        speechRecognitionTimeoutInMilliseconds: 1000
      prompt:
        text:
          - "\u0647\u0630\u0627 \u0627\u062e\u062a\u0628\u0627\u0631 \u0627\u0644\u0644\u063a\u0629 \u0627\u0644\u0639\u0631\u0628\u064a\u0629."
        speak:
          - "\u0647\u0630\u0627 \u0627\u062e\u062a\u0628\u0627\u0631 \u0627\u0644\u0644\u063a\u0629 \u0627\u0644\u0639\u0631\u0628\u064a\u0629."
      entity:
        kind: BooleanPrebuiltEntity
        dtmfMultipleChoiceOptions:
          generateMapping: true

    - kind: SetVariable
      id: language_probe_english
      variable: System.User.Language
      value:
        kind: OptionDataValue
        type:
          kind: SystemOptionSet
          name: Locale
        value: English

    - kind: Question
      id: language_probe_english_message
      interruptionPolicy:
        allowInterruption: false
      alwaysPrompt: true
      variable: init:Topic.EnglishConfirmed
      voiceInputSettings:
        silenceDetectionTimeoutInMilliseconds: 2000
        repeatCountOnSilence: 0
        defaultValueMissingAction: SetEmpty
        defaultValueOnSilence: =Blank()
      prompt:
        text:
          - This is the English language test.
        speak:
          - This is the English language test.
      entity:
        kind: BooleanPrebuiltEntity
        dtmfMultipleChoiceOptions:
          generateMapping: true

    - kind: SetVariable
      id: language_probe_return_arabic
      variable: System.User.Language
      value:
        kind: OptionDataValue
        type:
          kind: SystemOptionSet
          name: Locale
        value: Arabic

    - kind: Question
      id: language_probe_return_arabic_message
      interruptionPolicy:
        allowInterruption: false
      alwaysPrompt: true
      variable: init:Topic.ReturnArabicConfirmed
      voiceInputSettings:
        silenceDetectionTimeoutInMilliseconds: 2000
        repeatCountOnSilence: 0
        defaultValueMissingAction: SetEmpty
        defaultValueOnSilence: =Blank()
      prompt:
        text:
          - "\u0639\u062f\u0646\u0627 \u0627\u0644\u0622\u0646 \u0625\u0644\u0649 \u0627\u0644\u0644\u063a\u0629 \u0627\u0644\u0639\u0631\u0628\u064a\u0629."
        speak:
          - "\u0639\u062f\u0646\u0627 \u0627\u0644\u0622\u0646 \u0625\u0644\u0649 \u0627\u0644\u0644\u063a\u0629 \u0627\u0644\u0639\u0631\u0628\u064a\u0629."
      entity:
        kind: BooleanPrebuiltEntity
        dtmfMultipleChoiceOptions:
          generateMapping: true

    - kind: EndConversation
      id: language_probe_end

inputType: {}
outputType: {}
